<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Choose Peace · Morning Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Nunito+Sans:wght@400;600&display=swap">
<style>
:root{--ink:#f4efe6;--ink-dim:rgba(244,239,230,.66);--glow:#ffc98a;--f-display:"Fraunces",Georgia,serif;--f-body:"Nunito Sans",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#22242e;color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.words{position:fixed;left:0;right:0;bottom:calc(12% + env(safe-area-inset-bottom,0px));text-align:center;padding:0 24px;pointer-events:none}
.line{font-family:var(--f-display);font-weight:300;font-size:clamp(24px,6.4vw,38px);line-height:1.25;opacity:0;transform:translateY(6px);transition:opacity 2.2s ease,transform 2.2s ease}
.line.on{opacity:1;transform:none}
.line.small{font-family:var(--f-body);font-size:15px;color:var(--ink-dim);margin-top:14px}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.top a,.top button{font:600 14px var(--f-body);color:var(--ink);background:rgba(20,22,38,.5);border:1px solid rgba(244,239,230,.18);border-radius:999px;padding:9px 14px;text-decoration:none;cursor:pointer}
@media (prefers-reduced-motion:reduce){.line{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div class="top"><a href="/">&larr; Morning Flight</a><button id="voice" type="button">Hear it</button></div>
<div class="words" aria-live="polite">
  <div class="line" id="l1">It's loud out there.</div>
  <div class="line" id="l2">You don't have to fix all of it.</div>
  <div class="line" id="l3">You just choose peace.</div>
  <div class="line small" id="l4">Hold the screen as you breathe in. Let go as you breathe out.</div>
</div>
<script>
(()=>{
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,DPR,cx,cy,base;
function size(){ DPR=Math.min(2,devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); cx=W/2; cy=H*0.42; base=Math.min(W,H)*0.2; }
addEventListener('resize',size); size();
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;

// The chaos: scribbles that live outside the calm and crackle in place.
const SCRIB=Array.from({length:320},()=>({a:Math.random()*Math.PI*2, d:0.12+Math.pow(Math.random(),0.8)*3.2, len:18+Math.random()*46, k:4+(Math.random()*7|0), w:0.8+Math.random()*2.2, seed:Math.random()*1000}));
// Sparks: brief white flecks in the static.
const SPARK=Array.from({length:60},()=>({a:Math.random()*Math.PI*2, d:1.2+Math.random()*2, life:Math.random()}));
// Motes: slow warm specks inside the calm.
const MOTE=Array.from({length:22},()=>({a:Math.random()*Math.PI*2, r:Math.random()*0.8, s:0.1+Math.random()*0.25, z:1+Math.random()*2}));

let holding=false, calm=0, t=0, last=performance.now();
const down=e=>{ if(e.target.closest&&e.target.closest('.top')) return; holding=true; };
const up=()=>{ holding=false; };
addEventListener('pointerdown',down); addEventListener('pointerup',up); addEventListener('pointercancel',up);
addEventListener('keydown',e=>{ if(e.code==='Space'){ e.preventDefault(); holding=true; } });
addEventListener('keyup',e=>{ if(e.code==='Space') holding=false; });

const rnd=n=>{ const x=Math.sin(n*12.9898)*43758.5453; return x-Math.floor(x); };

function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt;
  // Breathing in widens the calm; breathing out lets it settle back slowly. It never closes.
  calm+=((holding?1:0)-calm)*(holding?0.55:0.22)*dt;
  const R=base*(1+0.9*calm)+Math.sin(t*1.1)*base*0.03;
  const jitter=still?0:(1-calm*0.75); // the chaos quietens as you breathe

  // Outside: grey static
  ctx.fillStyle='#262833'; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=0.06; ctx.fillStyle='#000';
  for(let i=0;i<220;i++){ const x=rnd(i+((t*24)|0)*7)*W, y=rnd(i*3.1+((t*24)|0))*H; ctx.fillRect(x,y,2,2); }
  ctx.globalAlpha=1;

  // Scribbles: jagged black strokes, redrawn every frame so they crackle
  ctx.lineCap='round'; ctx.lineJoin='round';
  const tick=still?0:((t*18)|0);
  for(const s of SCRIB){
    const dist=R+6+s.d*base*0.62*(1+calm*0.25), a=s.a+Math.sin(t*0.15+s.seed)*0.05;
    let x=cx+Math.cos(a)*dist, y=cy+Math.sin(a)*dist;
    ctx.strokeStyle=`rgba(5,5,8,${0.55+0.4*rnd(s.seed+tick)})`; ctx.lineWidth=s.w;
    ctx.beginPath(); ctx.moveTo(x,y);
    for(let k=0;k<s.k;k++){
      const ang=a+Math.PI/2+(rnd(s.seed+k+tick*1.7)-0.5)*3.4;
      const step=s.len/s.k*(0.6+rnd(s.seed*2+k+tick)*0.8)*(0.6+0.6*jitter);
      x+=Math.cos(ang)*step; y+=Math.sin(ang)*step; ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  // Sparks
  for(const p of SPARK){
    p.life-=dt*(1.5+jitter*2); if(p.life<0){ p.life=1; p.a=Math.random()*Math.PI*2; p.d=1.15+Math.random()*2; }
    if(p.life>0.75&&jitter>0.2){ const dist=R+p.d*base*0.5, x=cx+Math.cos(p.a)*dist, y=cy+Math.sin(p.a)*dist;
      ctx.strokeStyle=`rgba(244,239,230,${(p.life-0.75)*3*jitter})`; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+(rnd(p.a)-0.5)*10,y+(rnd(p.d)-0.5)*10); ctx.stroke(); }
  }

  // Inside: the calm. A pocket of sunrise.
  const halo=ctx.createRadialGradient(cx,cy,R*0.9,cx,cy,R*1.35);
  halo.addColorStop(0,'rgba(255,201,138,.28)'); halo.addColorStop(1,'rgba(255,201,138,0)');
  ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(cx,cy,R*1.35,0,Math.PI*2); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
  const sky=ctx.createLinearGradient(0,cy-R,0,cy+R);
  sky.addColorStop(0,'#3a4470'); sky.addColorStop(0.55,'#c98a8a'); sky.addColorStop(0.85,'#ffc98a'); sky.addColorStop(1,'#ffe2b8');
  ctx.fillStyle=sky; ctx.fillRect(cx-R,cy-R,R*2,R*2);
  // sun, low and soft
  const sun=ctx.createRadialGradient(cx,cy+R*0.62,0,cx,cy+R*0.62,R*0.7);
  sun.addColorStop(0,'rgba(255,243,220,.95)'); sun.addColorStop(0.25,'rgba(255,214,160,.55)'); sun.addColorStop(1,'rgba(255,201,138,0)');
  ctx.fillStyle=sun; ctx.fillRect(cx-R,cy-R,R*2,R*2);
  for(const m of MOTE){ m.a+=m.s*dt*0.3; const x=cx+Math.cos(m.a)*m.r*R, y=cy+Math.sin(m.a*1.3)*m.r*R*0.8;
    ctx.fillStyle='rgba(255,243,220,.5)'; ctx.beginPath(); ctx.arc(x,y,m.z,0,Math.PI*2); ctx.fill(); }
  // the plane, drifting, unbothered
  const px=cx+Math.sin(t*0.4)*R*0.08, py=cy-R*0.08+Math.sin(t*0.9)*R*0.04+(holding?-1:1)*calm*R*0.04, tilt=Math.cos(t*0.9)*0.06-0.08;
  const s=Math.max(16,R*0.16);
  ctx.translate(px,py); ctx.rotate(tilt);
  ctx.fillStyle='#fff3dc'; ctx.beginPath(); ctx.moveTo(s*1.4,0); ctx.lineTo(-s,-s*0.55); ctx.lineTo(-s*0.4,0); ctx.lineTo(-s,s*0.55); ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.18)'; ctx.beginPath(); ctx.moveTo(s*1.4,0); ctx.lineTo(-s*0.4,0); ctx.lineTo(-s,s*0.55); ctx.closePath(); ctx.fill();
  ctx.restore();
  // a clean edge so the calm reads as a boundary the chaos can't cross
  ctx.strokeStyle='rgba(255,226,184,.55)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// The words arrive slowly, one at a time.
[['l1',1200],['l2',4200],['l3',7600],['l4',11000]].forEach(([id,ms])=>setTimeout(()=>document.getElementById(id).classList.add('on'),ms));

// A calm voice, if the device has one. Slow, low, British where possible.
document.getElementById('voice').addEventListener('click',()=>{
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const vs=speechSynthesis.getVoices(), v=vs.find(x=>/en-GB/i.test(x.lang)&&/Daniel|Serena|Kate|Arthur|Martha|Google UK/i.test(x.name))||vs.find(x=>/en-GB/i.test(x.lang))||null;
  const lines=["It's loud out there.","You don't have to fix all of it.","You just choose peace."];
  lines.forEach((l,i)=>{ const u=new SpeechSynthesisUtterance(l); if(v) u.voice=v; u.rate=0.78; u.pitch=0.9; u.volume=0.9; speechSynthesis.speak(u); if(i<lines.length-1){ const p=new SpeechSynthesisUtterance(' '); p.rate=0.5; speechSynthesis.speak(p); } });
});
})();
</script>
</body>
</html>
